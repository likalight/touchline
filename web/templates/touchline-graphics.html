<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Touchline graphics</title>
<!--
  Touchline broadcast graphics template: 1920x1080, transparent, keyable.

  Works three ways:
  1. CasparCG HTML producer:  CG 1-20 ADD 0 "touchline-graphics" 1 "<templateData>{cue JSON}</templateData>"
     CasparCG calls update(data), play(), next(), stop().
  2. SPX Graphics Controller: the SPXGCTemplateDefinition below exposes title / line / kind fields.
  3. Live:  touchline-graphics.html?live=1&session=demo&lang=es&persona=studio
     subscribes to the Touchline stream and plays every approved cue on the match clock.

  Data is a `touchline.overlay/1` cue (docs/OVERLAY_CONTRACT.md) or a flat {title, line, kind, team} object.
-->
<script>
window.SPXGCTemplateDefinition = {
  description: "Touchline lower third (verified insight)",
  playserver: "OVERLAY", playchannel: "1", playlayer: "7", webplayout: "7", out: "manual", uicolor: "2",
  dataformat: "json",
  DataFields: [
    { field: "f0", ftype: "textfield", title: "Headline", value: "Ravi Varga completes his hat-trick" },
    { field: "f1", ftype: "textfield", title: "Why it matters", value: "Kestrel Bay FC were down to 2% win probability" },
    { field: "f2", ftype: "dropdown", title: "Style", value: "goal",
      items: [{ text: "Goal banner", value: "goal" }, { text: "Insight", value: "insight" }, { text: "Storyline", value: "story" }] },
    { field: "f3", ftype: "textfield", title: "Team colour", value: "#1f6feb" }
  ]
};
</script>
<style>
@font-face { font-family: "Barlow Condensed"; src: url("../fonts/BarlowCondensed-Bold.woff2") format("woff2"); font-weight: 700; }
@font-face { font-family: "Barlow Condensed"; src: url("../fonts/BarlowCondensed-SemiBold.woff2") format("woff2"); font-weight: 600; }
@font-face { font-family: "Source Serif 4"; src: url("../fonts/SourceSerif4.woff2") format("woff2"); font-weight: 200 900; }
@font-face { font-family: "Barlow"; src: url("../fonts/Barlow-SemiBold.woff2") format("woff2"); font-weight: 600; }
:root {
  --ink: #eef0e8; --panel: rgba(12, 36, 27, .95); --accent: #f2c14e; --paper: #eef0e8; --turf: #0f2b20;
  --team: #1f6feb;
  --in: cubic-bezier(.16, .84, .24, 1); --out: cubic-bezier(.6, 0, .84, .24);
}
html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: transparent; }
body.preview { background: #1d5a3c; }
/* title-safe area: 90% of the frame */
.safe { position: absolute; left: 96px; right: 96px; top: 54px; bottom: 54px; }

.lt { position: absolute; left: 0; bottom: 40px; display: grid; grid-template-columns: 14px auto; opacity: 0; }
.lt .bar { background: var(--accent); transform: scaleY(0); transform-origin: bottom; }
.lt .team { position: absolute; left: 14px; top: 0; height: 8px; width: 0; background: var(--team); }
.lt .body { background: var(--panel); padding: 26px 40px 28px 34px; clip-path: inset(0 100% 0 0); min-width: 560px; max-width: 1260px; }
.lt .kicker { font: 600 24px/1 Barlow, sans-serif; color: var(--accent); display: flex; gap: 14px; align-items: center; opacity: 0; transform: translateY(10px); }
.lt .kicker svg { width: 22px; height: 22px; }
.lt .title { font: 700 66px/1.02 "Barlow Condensed", sans-serif; color: var(--ink); margin-top: 10px; opacity: 0; transform: translateY(18px); letter-spacing: .005em; }
.lt .line { font: 400 34px/1.3 "Source Serif 4", serif; color: #dfe5da; margin-top: 10px; opacity: 0; transform: translateY(14px); max-width: 1150px; }
.lt.goal .body { background: var(--paper); }
.lt.goal .title { color: var(--turf); font-size: 86px; }
.lt.goal .line { color: #284a3a; }
.lt.goal .kicker { color: #8a5a00; }
.lt.story .bar { background: var(--ink); }

.lt.on { opacity: 1; }
.lt.on .bar { transform: scaleY(1); transition: transform .22s var(--in); }
.lt.on .team { width: calc(100% - 14px); transition: width .5s .12s var(--in); }
.lt.on .body { clip-path: inset(0 0 0 0); transition: clip-path .42s .08s var(--in); }
.lt.on .kicker { opacity: 1; transform: none; transition: all .3s .32s var(--in); }
.lt.on .title { opacity: 1; transform: none; transition: all .34s .38s var(--in); }
.lt.on .line { opacity: 1; transform: none; transition: all .34s .5s var(--in); }
.lt.off .body { clip-path: inset(0 100% 0 0); transition: clip-path .3s var(--out); }
.lt.off .bar { transform: scaleY(0); transition: transform .2s .22s var(--out); }
.lt.off .team { width: 0; transition: width .25s var(--out); }
.lt.off .kicker, .lt.off .title, .lt.off .line { opacity: 0; transition: opacity .15s; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="safe">
  <div class="lt" id="lt">
    <div class="bar"></div>
    <div class="body">
      <span class="team"></span>
      <div class="kicker"><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 6.5l2.5 2.5L10 3.5" stroke="currentColor" stroke-width="2" fill="none"/></svg><span id="kicker">Checked against the match data</span></div>
      <div class="title" id="title"></div>
      <div class="line" id="line"></div>
    </div>
  </div>
</div>
<script>
"use strict";
const qs = new URLSearchParams(location.search);
const LANG = qs.get("lang") || "en", PERSONA = qs.get("persona") || "studio";
const KICKER = { en: "Checked against the match data", es: "Verificado con los datos del partido", fr: "Vérifié avec les données du match", pt: "Verificado com os dados do jogo" };
const el = (id) => document.getElementById(id);
let current = null, outTimer = null;

function parse(data) {
  if (typeof data === "string") {
    const m = data.match(/<(templateData|componentData|data)[^>]*>([\s\S]*)<\/\1>/);
    const raw = m ? m[2] : data;
    try { return JSON.parse(raw); } catch { return { title: raw }; }
  }
  return data || {};
}
function normalise(d) {
  // accepts a touchline.overlay/1 cue, an SPX field set, or a flat object
  if (d.schema === "touchline.overlay/1") {
    const c = (d.copy && (d.copy[LANG] || d.copy.en)) || {};
    return { title: c.title || d.kind, line: c.line || "", style: d.kind === "goal" ? "goal" : d.kind && d.kind.startsWith("story") ? "story" : "insight",
             team: d.data && d.data.team, hold: Math.min(12, Math.max(5, d.duration_s || 7)) };
  }
  if ("f0" in d) return { title: d.f0, line: d.f1 || "", style: d.f2 || "insight", teamColor: d.f3 };
  return { title: d.title || "", line: d.line || "", style: d.style || "insight", team: d.team, teamColor: d.teamColor, hold: d.hold };
}
window.update = function update(data) {
  current = normalise(parse(data));
  el("title").textContent = current.title;
  el("line").textContent = current.line;
  el("kicker").textContent = KICKER[LANG] || KICKER.en;
  const lt = el("lt");
  lt.classList.remove("goal", "story", "insight");
  lt.classList.add(current.style);
  if (current.teamColor) document.documentElement.style.setProperty("--team", current.teamColor);
  else if (current.team && window.__teams) document.documentElement.style.setProperty("--team", window.__teams[current.team]);
};
window.play = function play() {
  const lt = el("lt");
  lt.classList.remove("off"); void lt.offsetWidth; lt.classList.add("on");
};
window.stop = function stop() {
  const lt = el("lt");
  lt.classList.add("off"); setTimeout(() => lt.classList.remove("on", "off"), 520);
};
window.next = function next() { window.stop(); };
// SPX aliases
window.runTemplateUpdate = () => window.update(Object.fromEntries(["f0", "f1", "f2", "f3"].map((f) => [f, (document.getElementById(f) || {}).innerText || ""])));
window.runAnimationIN = window.play;
window.runAnimationOUT = window.stop;

/* live mode: subscribe to Touchline and play approved cues */
if (qs.get("live")) {
  if (qs.get("preview")) document.body.classList.add("preview");
  const sid = qs.get("session") || "demo";
  const es = new EventSource(`${qs.get("api") || ""}/api/matches/${sid}/stream`);
  es.addEventListener("hello", (e) => { const h = JSON.parse(e.data); window.__teams = { home: h.match.home.color, away: h.match.away.color }; });
  const show = (ins, cue) => {
    if (!cue || cue.layer !== "lower_third" || !["auto", "approved"].includes(cue.approval)) return;
    const r = ((ins.renders || {})[PERSONA] || {})[LANG] || ((ins.renders || {})[PERSONA] || {}).en;
    window.update({ title: r ? r.title : cue.kind, line: r && r.lines[0] ? r.lines[0].text : "", style: ins.kind === "goal" ? "goal" : ins.kind.startsWith("story") ? "story" : "insight",
                    team: ins.team, hold: cue.duration_s });
    window.play();
    clearTimeout(outTimer);
    outTimer = setTimeout(window.stop, Math.min(12, Math.max(5, cue.duration_s)) * 1000);
  };
  const seen = new Map();
  es.addEventListener("insight", (e) => { const m = JSON.parse(e.data); seen.set(m.insight.id, m.insight); if (!m.replayed) show(m.insight, m.insight.cue); });
  es.addEventListener("cue_update", (e) => { const c = JSON.parse(e.data).cue, ins = seen.get(c.insight_id); if (ins && c.approval === "approved") show(ins, c); });
}
if (qs.get("demo")) { document.body.classList.add("preview"); window.update(window.SPXGCTemplateDefinition.DataFields.reduce((o, f) => ({ ...o, [f.field]: f.value }), {})); window.play(); }
</script>
</body>
</html>
