name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Match memory navigation and evidence map contracts
        run: node --test tests/story.test.cjs
      - run: pip install -r requirements.txt -r functions/requirements.txt pytest
      - name: Unit, pipeline, API, A2A, Foundry wiring, drills, enterprise controls, Functions and mocked-LLM tests
        run: pytest -q
        env:
          TOUCHLINE_LLM: "off"
      - name: Evaluation gate (100% verified, every goal explained, latency, exactly-once ingest)
        run: python scripts/evaluate.py --matches 12 --gate --json-out evidence.json
      - name: Preserve evaluation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: touchline-evaluation-${{ github.sha }}
          path: |
            evidence.json
            docs/EVAL.md
      - name: Record bounded failure recovery and freeze comparison inputs
        run: |
          python scripts/record_recovery.py --output evidence/recovery.json
          python scripts/compare_agents.py --prepare --limit 12 --output evidence/comparison-inputs.json
      - name: Preserve agent evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: touchline-agent-evidence-${{ github.sha }}
          path: evidence/
      - name: Auto-eventing from video (pass precision/recall, speed error)
        run: python -m touchline.vision.autoevent --seed 7 --from-min 20 --minutes 3

  bicep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: az bicep build --file infra/main.bicep --stdout > /dev/null

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TOUCHLINE_LLM: "off"
      TOUCHLINE_URL: http://127.0.0.1:8765
      STORY_SCREENSHOTS: evidence/browser/story
      CENTRE_SCREENSHOTS: evidence/browser/centre
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r requirements.txt
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Start deterministic application
        run: |
          mkdir -p evidence/browser
          python -m uvicorn touchline.server:app --host 127.0.0.1 --port 8765 > evidence/browser/server.log 2>&1 &
          for i in $(seq 1 60); do curl -sf localhost:8765/api/ready && break; sleep 1; done
          curl -sf localhost:8765/api/ready > /dev/null
      - name: Judge story and full match-centre journeys
        run: |
          node tests/story-browser.cjs
          node tests/centre-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: touchline-browser-${{ github.sha }}
          path: evidence/browser/

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t touchline .
      - name: Container smoke test
        run: |
          docker run -d -p 8000:8000 --name touchline-smoke touchline
          for i in $(seq 1 60); do curl -sf localhost:8000/api/ready && break; sleep 1; done
          curl -sf localhost:8000/api/ready > /dev/null || { docker logs touchline-smoke; exit 1; }
          curl -sf localhost:8000/.well-known/agent-card.json > /dev/null
          curl -sf localhost:8000/static/tv3d.js > /dev/null
      - name: Export tested container for Azure deployment
        if: github.event_name == 'push'
        run: docker save touchline | gzip > touchline-container.tar.gz
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: touchline-container-${{ github.sha }}
          path: touchline-container.tar.gz
          retention-days: 3
