# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
name: touchline
metadata:
  template: touchline@1.0.0
services:
  web:
    project: .
    language: python
    host: containerapp
    docker:
      path: Dockerfile
      remoteBuild: true
  packages:
    project: functions
    language: python
    host: function
infra:
  provider: bicep
  path: infra
hooks:
  postprovision:
    # publish Touchline's agents to Foundry Agent Service (new version per run, content policy attached)
    posix:
      shell: sh
      run: python3 -m pip install -q -r requirements.txt && python3 scripts/foundry_publish.py
      continueOnError: false
    windows:
      shell: pwsh
      run: |
        python -m pip install -q -r requirements.txt
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        python scripts/foundry_publish.py
        exit $LASTEXITCODE
      continueOnError: false
